<section class="gallery" aria-label="Galería del vehículo">
  <div class="main-frame">
    <img class="main-image" [src]="images()[selectedIndex()]" [alt]="title()" />

    @if (images().length > 1) {
      <button class="gallery-nav previous" type="button" aria-label="Foto anterior" (click)="previousImage()">
        <span aria-hidden="true">‹</span>
      </button>
      <button class="gallery-nav next" type="button" aria-label="Foto siguiente" (click)="nextImage()">
        <span aria-hidden="true">›</span>
      </button>
    }
  </div>

  @if (images().length > 1) {
    <div class="thumbs">
      @for (image of images(); track image; let index = $index) {
        <button type="button" [class.active]="index === selectedIndex()" (click)="selectedIndex.set(index)">
          <img [src]="image" [alt]="title() + ' imagen ' + (index + 1)" />
        </button>
      }
    </div>
  }
</section>
