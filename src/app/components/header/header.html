<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Ir al inicio" (click)="closeMenu()">
    <img class="brand-logo" src="/images/logo-listanco-header-v3.png" alt="Taller &amp; Cars Listanco" />
    <span class="brand-name">Taller &amp; Cars Listanco</span>
  </a>

  <nav class="nav" aria-label="Navegación principal">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/stock" routerLinkActive="active">Stock</a>
    <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
  </nav>

  <a class="call-link" href="tel:607923867">Llamar</a>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Abrir menú de navegación"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="mobile-menu"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="mobile-menu" class="mobile-nav" [class.open]="menuOpen()" aria-label="Navegación móvil">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a>
    <a routerLink="/stock" routerLinkActive="active" (click)="closeMenu()">Stock</a>
    <a routerLink="/contacto" routerLinkActive="active" (click)="closeMenu()">Contacto</a>
    <a href="tel:607923867" (click)="closeMenu()">Llamar</a>
  </nav>
</header>
